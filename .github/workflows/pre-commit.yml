name: Pre-commit checks
on:
  pull_request:

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: SonarSource/gh-action_pre-commit@698a883e4d3a697bee22e5e16dff6b2f9572f44d # 1.2.2
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          extra-args: >
            --from-ref=origin/$BASE_REF
            --to-ref=$HEAD_SHA
