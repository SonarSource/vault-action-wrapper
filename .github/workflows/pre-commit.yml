name: Pre-commit checks
on:
  pull_request:

jobs:
  pre-commit:
    name: "pre-commit"
    runs-on: github-ubuntu-latest-s
    steps:
      - uses: SonarSource/gh-action_pre-commit@1181d422cbd3380624656c4dc46f6172263c0418 # 2.0.0
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          extra-args: >
            --from-ref=origin/$BASE_REF
            --to-ref=$HEAD_SHA
