---
# yamllint disable rule:truthy
name: Test action
on:
  pull_request:
    paths:
      - .github/workflows/test.yaml
      - action.yaml


jobs:

  vault-action:
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: exec vault-action
        id: actual
        uses: ./
        with:
          url: https://vault.staging.sonar.build:8200
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-ro token | github_ro;
            development/github/token/{REPO_OWNER_NAME_DASH}-ro org_name | org_name;
      - name: validate token
        shell: bash
        env:
          GITHUB_TOKEN: ${{ fromJSON(steps.actual.outputs.vault).github_ro }}
        run: |
          gh workflow list --all | grep "Test action"
      - name: validate org_name
        shell: bash
        run: |
          [[ "${{ fromJSON(steps.actual.outputs.vault).org_name }}" = "SonarSource" ]]

  vault-action-failure-diagnostics:
    runs-on: sonar-xs
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: exec vault-action against unreachable host
        id: failed
        continue-on-error: true
        uses: ./
        with:
          url: https://vault.invalid.example.test
          secrets: |
            development/github/token/{REPO_OWNER_NAME_DASH}-ro token | github_ro;
      - name: assert action failed and diagnostics were captured
        shell: bash
        env:
          OUTCOME: ${{ steps.failed.outcome }}
          DIAGNOSTICS: ${{ steps.failed.outputs.diagnostics }}
        run: |
          set -euo pipefail
          echo "outcome=$OUTCOME"
          echo "--- diagnostics ---"
          printf '%s\n' "$DIAGNOSTICS"
          echo "---"
          if [[ "$OUTCOME" != "failure" ]]; then
            echo "expected failure, got $OUTCOME"
            exit 1
          fi
          printf '%s\n' "$DIAGNOSTICS" > /tmp/diagnostics
          required=(
            '^runner_os='
            '^egress_ip='
            '^tcp_probe vault.invalid.example.test:443='
            '^first_attempt_outcome=failure'
            '^retry_outcome=failure'
          )
          for pattern in "${required[@]}"; do
            if ! grep -q "$pattern" /tmp/diagnostics; then
              echo "missing expected pattern: $pattern"
              exit 1
            fi
          done
