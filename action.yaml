---
name: Wrapper for hashicorp/vault-action
author: Malena Ebert
description: Simplifies the usage of hashicorp/vault-action
branding:
  color: green
  icon: lock
inputs:
  url:
    description: url of the HC vault instance
    default: https://vault.sonar.build
    required: false
  secrets:
    description: pattern to fetch secrets
    required: true
  jwtTtl:
    description: >-
      Time in seconds for the GitHub OIDC JWT token lifetime
      (e.g., "10800" for 3 hours). Defaults to 3600 (1 hour) if not specified.
    required: false
    default: '3600'
  role:
    description: |
      Vault JWT role to use for authentication. If not provided, auto-selects based on GITHUB_REF:
      - Protected refs (main, master, branch-*, tags/*) use 'github-{org}-{repo}-protected'
      - Other refs use 'github-{org}-{repo}'
    required: false
outputs:
  vault:
    description: Outputs of vault
    value: >-
      ${{ steps.secrets-retry.outcome == 'success'
      && toJSON(steps.secrets-retry.outputs)
      || toJSON(steps.secrets.outputs) }}
  diagnostics:
    description: Network diagnostics captured when the first Vault attempt fails. Empty on success.
    value: ${{ steps.netdiag.outputs.text }}
runs:
  using: composite
  steps:
    - name: replace placeholder
      id: replace
      env:
        SECRET_PATTERN: ${{ inputs.secrets }}
        INPUT_ROLE: ${{ inputs.role }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      with:
        script: |
          core.setOutput('pattern',
            process.env.SECRET_PATTERN
              .replaceAll('{GITHUB_REPOSITORY_OWNER}', context.repo.owner)
              .replaceAll('{GITHUB_REPOSITORY}', `${context.repo.owner}/${context.repo.repo}`)
              .replaceAll('{REPO_OWNER_NAME_DASH}', `${context.repo.owner}-${context.repo.repo}`)
              .replaceAll('{REPO_NAME}', context.repo.repo)
          );
          const inputRole = process.env.INPUT_ROLE;
          const baseRole = `github-${context.repo.owner}-${context.repo.repo}`;
          let selectedRole;
          if (inputRole) {
            selectedRole = inputRole;
            core.info(`Using explicit role: ${selectedRole}`);
          } else {
            const ref = process.env.GITHUB_REF || '';
            const PROTECTED_REF_PATTERNS = [
              /^refs\/heads\/main$/,
              /^refs\/heads\/master$/,
              /^refs\/heads\/branch-.+$/,
              /^refs\/tags\/.+$/,
            ];
            const isProtectedRef = PROTECTED_REF_PATTERNS.some(p => p.test(ref));
            selectedRole = isProtectedRef ? `${baseRole}-protected` : baseRole;
            core.info(`Auto-selected role: ${selectedRole} (ref: ${ref}, protected: ${isProtectedRef})`);
          }
          core.setOutput('vault-role', selectedRole)
    - name: Vault Secrets
      id: secrets
      continue-on-error: true
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
      with:
        url: ${{ inputs.url }}
        exportEnv: false
        method: jwt
        path: jwt-ghwf
        role: ${{ steps.replace.outputs.vault-role }}
        secrets: ${{ steps.replace.outputs.pattern }}
        jwtTtl: ${{ inputs.jwtTtl }}
    - name: Wait before retry
      if: steps.secrets.outcome == 'failure'
      shell: bash
      run: |
        echo "::warning::Vault secret retrieval failed on first attempt. Retrying in 10 seconds..."
        sleep 10
    - name: Vault Secrets (retry)
      id: secrets-retry
      if: steps.secrets.outcome == 'failure'
      continue-on-error: true
      uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc  # v4.0.0
      with:
        url: ${{ inputs.url }}
        exportEnv: false
        method: jwt
        path: jwt-ghwf
        role: ${{ steps.replace.outputs.vault-role }}
        secrets: ${{ steps.replace.outputs.pattern }}
        jwtTtl: ${{ inputs.jwtTtl }}
    - name: Capture network diagnostics
      id: netdiag
      if: steps.secrets.outcome == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        VAULT_URL: ${{ inputs.url }}
        FIRST_ATTEMPT_OUTCOME: ${{ steps.secrets.outcome }}
        RETRY_OUTCOME: ${{ steps.secrets-retry.outcome }}
      with:
        script: |
          const text = await gatherNetworkDiagnostics(process.env.VAULT_URL);
          core.info(`--- network diagnostics ---\n${text}\n---`);
          core.setOutput('text', text);

          async function gatherNetworkDiagnostics(targetUrl) {
            try {
              const net = require('node:net');
              let hostname, tcpPort;
              try {
                const u = new URL(targetUrl);
                hostname = u.hostname;
                tcpPort = Number(u.port) || (u.protocol === 'http:' ? 80 : 443);
              } catch (e) {
                return `vault_url=${targetUrl}\nurl_parse=ERROR ${e.message}`;
              }
              const lines = [
                `runner_os=${process.env.RUNNER_OS || ''} ` +
                `runner_arch=${process.env.RUNNER_ARCH || ''} ` +
                `runner_name=${process.env.RUNNER_NAME || ''}`,
                `vault_url=${targetUrl}`,
                `time=${new Date().toISOString()}`,
                `first_attempt_outcome=${process.env.FIRST_ATTEMPT_OUTCOME || ''}`,
                `retry_outcome=${process.env.RETRY_OUTCOME || ''}`,
              ];
              const ac = new AbortController();
              const t = setTimeout(() => ac.abort(), 5000);
              try {
                const r = await fetch('https://checkip.amazonaws.com', { signal: ac.signal });
                lines.push(`egress_ip=${(await r.text()).trim()}`);
              } catch (e) {
                lines.push(`egress_ip=ERROR ${e.message}`);
              } finally {
                clearTimeout(t);
              }
              const probe = (host, p) => new Promise(resolve => {
                const started = Date.now();
                const s = net.createConnection({ host, port: p });
                const finish = (result) => {
                  try { s.destroy(); } catch {}
                  resolve(`${result} (${Date.now() - started}ms)`);
                };
                s.setTimeout(5000);
                s.once('connect', () => finish('ok'));
                s.once('timeout', () => finish('timeout'));
                s.once('error', (err) => finish(`error ${err.code || err.message}`));
              });
              lines.push(`tcp_probe ${hostname}:${tcpPort}=${await probe(hostname, tcpPort)}`);
              return lines.join('\n');
            } catch (e) {
              return `diagnostics=ERROR ${e.message}`;
            }
          }
    - name: Diagnose secret access failures
      id: diagnose
      if: steps.secrets.outcome == 'failure' && steps.secrets-retry.outcome == 'failure'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
      env:
        VAULT_URL: ${{ inputs.url }}
        VAULT_ROLE: ${{ steps.replace.outputs.vault-role }}
        SECRET_PATTERN: ${{ steps.replace.outputs.pattern }}
        NETWORK_DIAGNOSTICS: ${{ steps.netdiag.outputs.text }}
      with:
        script: |
          const vaultUrl = process.env.VAULT_URL.replace(/\/+$/, '');
          const vaultRole = process.env.VAULT_ROLE;
          const secretPattern = process.env.SECRET_PATTERN;
          const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}` +
            `/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const SUPPORT_CHANNEL = '#ask-platform-eng-xp';
          const TERRAFORM_REPO = 'https://github.com/SonarSource/re-terraform-aws-vault';
          const PORT_SELF_SERVICE = 'https://app.getport.io/self-serve?action=manage_vault_policy';
          const DEBUG_HINT =
            `To investigate further, use the Claude Code developer-tooling plugin\n` +
            `(https://github.com/SonarSource/awesome-ai) and run the\n` +
            `debug-github-actions skill with this workflow run URL:\n` +
            `  ${runUrl}`;
          let vaultToken;
          try {
            const idToken = await core.getIDToken();
            const loginResp = await fetch(`${vaultUrl}/v1/auth/jwt-ghwf/login`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ role: vaultRole, jwt: idToken }),
            });
            if (!loginResp.ok) {
              const status = loginResp.status;
              const body = await loginResp.text();
              if (status >= 500 && status <= 599) {
                core.setFailed(
                  `Vault authentication failed (HTTP ${status}) due to a Vault/server-side error.\n\n` +
                  `An automatic retry was already attempted and also failed.\n` +
                  `Check https://sonarsource-internal.statuspage.io/ for ongoing incidents.\n` +
                  `If there is no ongoing incident, ask for help in ${SUPPORT_CHANNEL}.\n\n` +
                  `Details: ${body}`
                );
                return;
              }
              core.setFailed(
                `Vault authentication failed (HTTP ${status}) — ` +
                `the role "${vaultRole}" does not exist or is not authorized.\n\n` +
                `This usually means the repository has not been onboarded to Vault, ` +
                `or the Vault role is misconfigured.\n` +
                `To fix, add or update this repository's Vault role in:\n` +
                `  ${TERRAFORM_REPO}\n\n` +
                `${DEBUG_HINT}\n\n` +
                `If you still need help, ask in ${SUPPORT_CHANNEL}.\n\n` +
                `Details: ${body}`
              );
              return;
            }
            const loginData = await loginResp.json();
            vaultToken = loginData.auth.client_token;
          } catch (err) {
            const diagnostics = process.env.NETWORK_DIAGNOSTICS || '(not gathered)';
            core.setFailed(
              `Vault authentication failed — could not obtain a Vault token.\n` +
              `An automatic retry was already attempted and also failed.\n\n` +
              `If the error below is \`fetch failed\`, the request likely never reached Vault ` +
              `(network/firewall drop). Include the block below when asking for help in ${SUPPORT_CHANNEL}:\n\n` +
              `--- network diagnostics ---\n${diagnostics}\n---\n\n` +
              `${DEBUG_HINT}\n\n` +
              `Error: ${err.message}`
            );
            return;
          }
          const secretPaths = [...new Set(
            secretPattern.split(/[;\n]/).map(l => l.trim()).filter(l => l.length > 0)
              .map(l => l.split(/\s+/)[0]).filter(p => p.length > 0)
          )];
          if (secretPaths.length === 0) {
            core.setFailed('Vault action failed but could not parse secret paths for diagnosis.');
            return;
          }
          core.info('');
          core.info('=== Diagnosing Vault secret access failure ===');
          core.info(`Role: ${vaultRole}`);
          core.info('');
          const denied = [];
          try {
            const resp = await fetch(`${vaultUrl}/v1/sys/capabilities-self`, {
              method: 'POST',
              headers: {
                'X-Vault-Token': vaultToken,
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ paths: secretPaths }),
            });
            if (resp.ok) {
              const data = await resp.json();
              for (const secretPath of secretPaths) {
                const caps = data[secretPath] ?? data.capabilities ?? [];
                if (caps.includes('deny')) {
                  core.error(`  DENIED  ${secretPath}`);
                  denied.push(secretPath);
                } else if (caps.length > 0) {
                  core.info(`  OK      ${secretPath} (${caps.join(', ')})`);
                } else {
                  core.warning(`  ???     ${secretPath} (no capabilities returned)`);
                }
              }
            } else {
              core.warning(
                `Capability check failed with status ${resp.status}; individual results unavailable.`
              );
              for (const secretPath of secretPaths) {
                core.warning(`  ???     ${secretPath} (capability check returned ${resp.status})`);
              }
            }
          } catch (err) {
            core.warning(`Capability check failed: ${err.message}`);
            for (const secretPath of secretPaths) {
              core.warning(`  ???     ${secretPath} (${err.message})`);
            }
          }
          core.info('');
          if (denied.length > 0) {
            // All KV secret paths contain '/kv/' in their mount path
            const deniedKv = denied.filter(p => p.includes('/kv/'));
            const deniedDynamic = denied.filter(p => !p.includes('/kv/'));
            let msg = `Vault secret access denied for ${denied.length} path(s).\n\n`;
            if (deniedKv.length > 0) {
              msg +=
                `The following path(s) need a policy update — you can fix this yourself\n` +
                `using the self-service portal:\n` +
                `  ${deniedKv.join('\n  ')}\n` +
                `Grant access here: ${PORT_SELF_SERVICE}\n\n`;
            }
            if (deniedDynamic.length > 0) {
              msg +=
                `The following path(s) require a Vault policy change — request it\n` +
                `in the infrastructure repo:\n` +
                `  ${deniedDynamic.join('\n  ')}\n` +
                `Update the policy here: ${TERRAFORM_REPO}\n\n`;
            }
            msg += `${DEBUG_HINT}\n\n`;
            msg += `If you still need help, ask in ${SUPPORT_CHANNEL}.`;
            core.setFailed(msg);
          } else {
            core.setFailed(
              `Vault secrets retrieval failed but the root cause could not be determined automatically.\n\n` +
              `${DEBUG_HINT}\n\n` +
              `If you still need help, ask in ${SUPPORT_CHANNEL}.`
            );
          }
